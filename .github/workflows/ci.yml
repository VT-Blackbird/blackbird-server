name: CI Scaffold

on:
  push:
    branches: [ production, dev ]
  pull_request:
    branches: [ production, dev ]

jobs:
  quality-assurance:
    name: Quality Assurance (Ruff, MyPy, Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Run CI
        run: |
          # We use the exact same script you just perfected!
          # We use --build to ensure the latest requirements are installed
          docker compose run --rm backend bash ./scripts/check.sh