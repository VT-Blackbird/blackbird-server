name: CI Scaffold

on:
  push:
    branches: [ production, dev ]
  pull_request:
    branches: [ production, dev ]

jobs:
  quality-assurance:
    name: Quality Assurance (Ruff, MyPy, Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create .env file
        run: |
          cat <<EOF > .env
          PROXIES_JSON=${{ secrets.PROXIES_JSON }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          BSKY_HANDLE=${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD=${{ secrets.BSKY_APP_PASSWORD }}
          ENV=ci
          EOF
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Run CI
        run: |
          docker compose build backend
          docker compose up -d db
          sleep 10
          docker compose run --rm backend python3 -m app.db.init
          docker compose run --rm backend bash ./scripts/check.sh

  code-coverage:
    name: Code Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Create .env file
        run: |
          cat <<EOF > .env
          PROXIES_JSON=${{ secrets.PROXIES_JSON }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          BSKY_HANDLE=${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD=${{ secrets.BSKY_APP_PASSWORD }}
          ENV=ci
          EOF
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Run Coverage
        run: |
          docker compose build backend
          docker compose up -d db
          sleep 10
          docker compose run --rm backend python3 -m app.db.init
          docker compose run --rm backend bash ./scripts/coverage.sh
