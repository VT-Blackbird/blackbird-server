name: CI Scaffold

on:
  # ONLY run on dev when someone proposes a change (PR)
  pull_request:
    branches: [ dev ]

  # ONLY run on production when the merge actually happens
  push:
    branches: [ production ]

jobs:
  # NEW JOB: Build once and cache
  build-and-cache:
    name: Build and Cache Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
        
      - name: Create .env file
        run: |
          cat <<EOF > .env
          PROXIES_JSON=${{ secrets.PROXIES_JSON }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          BSKY_HANDLE=${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD=${{ secrets.BSKY_APP_PASSWORD }}
          ENV=ci
          EOF
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: backend-ci:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  quality-assurance:
    name: Quality Assurance (Ruff, MyPy, Pytest)
    needs: build-and-cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create .env file
        run: |
          cat <<EOF > .env
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=${{ secrets.ALGORITHM }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          PROXIES_JSON=${{ secrets.PROXIES_JSON }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          BSKY_HANDLE=${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD=${{ secrets.BSKY_APP_PASSWORD }}
          ENV=ci
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (Uses Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: backend-ci:latest
          cache-from: type=gha

      - name: Run QA
        run: |
          docker compose up -d db
          # Use the newly built/loaded image
          docker compose run --rm backend python3 -m app.db.init
          docker compose run --rm backend bash ./scripts/check.sh

  code-coverage:
    name: Code Coverage Check
    needs: build-and-cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
        
      - name: Create .env file
        run: |
          cat <<EOF > .env
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=${{ secrets.ALGORITHM }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          PROXIES_JSON=${{ secrets.PROXIES_JSON }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          BSKY_HANDLE=${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD=${{ secrets.BSKY_APP_PASSWORD }}
          ENV=ci
          EOF
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (Uses Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: backend-ci:latest
          cache-from: type=gha

      - name: Run Coverage
        run: |
          docker compose up -d db
          docker compose run --rm backend python3 -m app.db.init
          docker compose run --rm backend bash ./scripts/coverage.sh
